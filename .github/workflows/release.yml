name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: release

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=${{ inputs.tag }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Ensure target tag is present
        shell: pwsh
        run: |
          git fetch --force --tags
          git rev-parse "$env:RELEASE_TAG" | Out-Null

      - name: Check out release tag
        shell: pwsh
        run: git checkout "$env:RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt pyinstaller

      - name: Validate version against tag
        shell: pwsh
        run: py -B tools/check_release_version.py --tag "$env:RELEASE_TAG"

      - name: Build Unlock
        shell: pwsh
        run: py -m PyInstaller unlock.spec --noconfirm

      - name: Select signing mode
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          CODE_SIGNING_PUBLISHER: ${{ vars.CODE_SIGNING_PUBLISHER }}
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID, $env:AZURE_TENANT_ID, $env:AZURE_SUBSCRIPTION_ID,
            $env:AZURE_ARTIFACT_SIGNING_ENDPOINT, $env:AZURE_ARTIFACT_SIGNING_ACCOUNT,
            $env:AZURE_ARTIFACT_SIGNING_PROFILE, $env:CODE_SIGNING_PUBLISHER
          )
          if ($required -contains "") {
            "SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RELEASE_PUBLISHER=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Warning "Azure Artifact Signing is not configured; publishing an unsigned release."
          } else {
            "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RELEASE_PUBLISHER=$env:CODE_SIGNING_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # OIDC issues a short-lived GitHub token for Azure; no code-signing
      # private key or long-lived client secret is stored in this repository.
      - name: Authenticate to Azure Artifact Signing
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # When configured, the Artifact Signing identity and publisher name stay
      # outside the repository in GitHub secrets/variables.
      - name: Sign application executables
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Unlock
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed application payload
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          py -B tools/verify_authenticode.py dist\Unlock --publisher "$env:RELEASE_PUBLISHER"

      - name: Package Unlock.zip
        shell: pwsh
        run: py -B tools/build_release_bundle.py --input dist/Unlock --output dist/Unlock.zip

      - name: Build bootstrap installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/Unlock.zip"
          $publisherArgs = if ($env:RELEASE_PUBLISHER) { @("--publisher", $env:RELEASE_PUBLISHER) } else { @() }
          py -B tools/build_unlock_setup.py --zip dist/Unlock.zip --version $version --package-url $packageUrl @publisherArgs

      - name: Sign bootstrap installer
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: UnlockSetup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every shipped executable
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          py -B tools/verify_authenticode.py dist\Unlock dist\UnlockSetup.exe --publisher "$env:RELEASE_PUBLISHER"

      - name: Write checksums
        shell: pwsh
        run: |
          $assets = @(
            "dist\Unlock.zip",
            "dist\loader_manifest.json",
            "dist\UnlockSetup.exe"
          )
          $lines = foreach ($path in $assets) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = [IO.Path]::GetFileName($path)
            "$hash  $name"
          }
          Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Value $lines -Encoding ascii

      - name: Attest release package provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/Unlock.zip

      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/UnlockSetup.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist\Unlock.zip",
            "dist\loader_manifest.json",
            "dist\UnlockSetup.exe",
            "dist\SHA256SUMS.txt"
          )
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --title "$env:RELEASE_TAG" --verify-tag --generate-notes
          }
